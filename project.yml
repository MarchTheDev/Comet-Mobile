# XcodeGen project for Comet for iOS.
#
#   xcodegen generate      # writes CometMobile.xcodeproj
#
# The project is generated rather than committed so it cannot drift from this
# file. Everything the app needs is in CometApp/; there is no web bundle, no npm
# step and no generated page — the interface is SwiftUI, drawn natively.
name: CometMobile
options:
  # Xcode 14's project format, readable by every Xcode from 14 onwards.
  projectFormat: xcode14_0
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    ENABLE_BITCODE: NO
    SWIFT_TREAT_WARNINGS_AS_ERRORS: NO
    CLANG_ANALYZER_NONNULL: YES
    SWIFT_EMIT_LOC_STRINGS: NO

targets:
  Comet:
    type: application
    platform: iOS
    sources:
      - path: CometApp
        excludes:
          - Resources/Info.plist
    settings:
      base:
        PRODUCT_NAME: Comet
        PRODUCT_BUNDLE_IDENTIFIER: com.march.comet
        INFOPLIST_FILE: CometApp/Resources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_STYLE: Automatic
        SUPPORTS_MACCATALYST: NO
        SWIFT_UPCOMING_FEATURE_MEMBER_IMPORT_VISIBILITY: NO

  CometTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: Comet
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.march.comet.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Comet:
    build:
      targets:
        Comet: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - CometTests
    archive:
      config: Release
