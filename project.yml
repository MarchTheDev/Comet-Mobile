# XcodeGen project for the Comet iOS shell.
#
#   xcodegen generate      # writes CometMobile.xcodeproj
#
# The .xcodeproj is generated rather than committed: the project is a handful of
# Swift files plus three resources, and a generated project cannot drift from
# this file. scripts/prepare.sh must have run first, because it puts the built
# Comet page in app/Resources/www and its icons in the asset catalog.
name: CometMobile
options:
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "16.0"
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    ENABLE_BITCODE: NO
    SWIFT_TREAT_WARNINGS_AS_ERRORS: NO
    CLANG_ANALYZER_NONNULL: YES

targets:
  Comet:
    type: application
    platform: iOS
    sources:
      # The shell itself.
      - path: app/CometMobile
      # The Tauri bridge, injected as a user script.
      - path: app/Resources/shim.js
        buildPhase: resources
      # The built Comet page. A folder reference, so the 9 MB of PDF.js assets
      # are copied verbatim and /pdfjs/... keeps working.
      - path: app/Resources/www
        type: folder
      - path: app/Resources/Assets.xcassets
    settings:
      base:
        PRODUCT_NAME: Comet
        PRODUCT_BUNDLE_IDENTIFIER: com.marco.comet
        INFOPLIST_FILE: app/Resources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_STYLE: Automatic
        SUPPORTS_MACCATALYST: NO

schemes:
  Comet:
    build:
      targets:
        Comet: all
    run:
      config: Debug
    archive:
      config: Release
