name: iOS

# Builds Comet as an unsigned .ipa. No Apple account, no certificates, no
# TestFlight: the sideloading tool signs the bundle on the device itself.

on:
  workflow_dispatch:
  push:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Unsigned IPA
    runs-on: macos-15
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate the project
        run: xcodegen generate

      - name: Compile
        run: |
          set -o pipefail
          xcodebuild \
            -project CometMobile.xcodeproj \
            -scheme Comet \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            -destination 'generic/platform=iOS' \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee .build.log

      - name: Package the IPA
        run: |
          APP="build/Build/Products/Release-iphoneos/Comet.app"
          test -d "$APP"
          mkdir -p out/Payload
          cp -R "$APP" out/Payload/Comet.app
          (cd out && zip -qry "Comet-unsigned.ipa" Payload)
          rm -rf out/Payload
          scripts/verify-ipa.sh out/Comet-unsigned.ipa | tee .verify.log
          sed 's/^/::notice::/' .verify.log

      - name: Attach the IPA to the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ github.sha }}
          RUN: ${{ github.run_number }}
        run: |
          TAG="ios-latest"
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
          {
            echo "Unsigned Comet for iOS, built from this repository."
            echo
            echo "- Commit: \`${SHA}\`"
            echo "- Build: ${RUN}"
            echo
            echo "Download \`Comet-unsigned.ipa\` and sign it with a sideloading tool"
            echo "(Sideloadly, AltStore/SideStore) or Xcode. It carries no signing"
            echo "material of its own."
            echo
            echo '```'
            cat .verify.log
            echo '```'
          } > .release-notes.md
          gh release create "$TAG" out/Comet-unsigned.ipa --draft --target "$SHA" \
            --title "Comet for iOS (latest build)" --notes-file .release-notes.md
          gh release view "$TAG" --json assets,isDraft,url --jq '"draft: \(.isDraft)  file: \(.assets[0].name)  \(.url)"' \
            | while IFS= read -r line; do echo "::notice::$line"; done

      - name: Surface compile errors
        if: failure()
        run: |
          if [ -f .build.log ]; then
            grep -E "error: " .build.log | sort -u | head -40 | while IFS= read -r line; do
              echo "::error::$line"
            done
            echo "::error::--- last lines of the build ---"
            tail -30 .build.log | while IFS= read -r line; do echo "::error::$line"; done
          fi
          exit 1

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-log
          path: .build.log
          if-no-files-found: ignore
          retention-days: 14

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: Comet-unsigned-ipa
          path: out/Comet-unsigned.ipa
          if-no-files-found: error
          retention-days: 30

  tests:
    name: Unit tests
    runs-on: macos-15
    timeout-minutes: 35

    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate the project
        run: xcodegen generate

      - name: Run the tests on a simulator
        run: |
          set -o pipefail
          UDID=$(xcrun simctl list devices available --json | python3 -c '
import json, sys
devices = json.load(sys.stdin)["devices"]
for runtime in sorted(devices, reverse=True):
    if "iOS" not in runtime:
        continue
    for device in devices[runtime]:
        if device["name"].startswith("iPhone"):
            print(device["udid"]); raise SystemExit
raise SystemExit(1)
')
          echo "simulator: $UDID"
          xcodebuild test \
            -project CometMobile.xcodeproj \
            -scheme Comet \
            -destination "id=$UDID" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            2>&1 | tee .tests.log

      - name: Surface test and compile errors
        if: failure()
        run: |
          if [ -f .tests.log ]; then
            grep -E "error: |failed|XCTAssert" .tests.log | sort -u | head -40 | while IFS= read -r line; do
              echo "::error::$line"
            done
          fi
          exit 1

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-log
          path: .tests.log
          if-no-files-found: ignore
          retention-days: 14
